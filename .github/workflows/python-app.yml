name: Datanar

on:
  push:
    branches: [ "main", "dev", "artem", "sergey" ]
  pull_request:
    branches: [ "main", "dev", "artem", "sergey", "vladimir" ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install ruff
        run: pip install -r requirements/test.txt
      - name: Run ruff check
        run: ruff check --show-fixes ./datanar
      - name: Run ruff format check
        run: ruff format --check --diff ./datanar

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Run flake8
        run: flake8 ./datanar

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install black
        run: pip install -r requirements/test.txt
      - name: Check code formatting with black
        run: black ./datanar --check --diff

  django-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    name: django-tests (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run Django tests
        working-directory: ./datanar
        run: python manage.py test

  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [ ruff, flake8, black, django-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Ключ на сервере ограничен forced command: что бы ни было в script,
          # выполнится только /usr/local/bin/deploy-datanar (git reset на
          # origin/main, compose up --build, проверка живости). Сам script
          # нужен action-у формально.
          script: |
            true
